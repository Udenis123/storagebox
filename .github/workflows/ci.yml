name: StorageBox CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: API — test & image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storagebox_bn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: storagebox_bn/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --runInBand

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: storagebox_bn
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/udenis123/storagebox-api:latest
            ghcr.io/udenis123/storagebox-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web — build & image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storagebox_fn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: storagebox_fn/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck & lint
        run: |
          npx tsc -b --noEmit
          npm run lint

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: storagebox_fn
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VITE_STORAGEBOX_API_URL=${{ vars.VITE_STORAGEBOX_API_URL != '' && vars.VITE_STORAGEBOX_API_URL || 'https://storagebox.urbinaryhub.rw' }}
            VITE_MAX_UPLOAD_MB=${{ vars.VITE_MAX_UPLOAD_MB != '' && vars.VITE_MAX_UPLOAD_MB || '5120' }}
          tags: |
            ghcr.io/udenis123/storagebox-web:latest
            ghcr.io/udenis123/storagebox-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sdk:
    name: SDK — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm test
